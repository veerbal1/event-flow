services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: eventflow
      POSTGRES_PASSWORD: eventflow
      POSTGRES_DB: eventflow
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U eventflow -d eventflow" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql

  localstack:
    image: localstack/localstack:4.0
    environment:
      SERVICES: sqs,sns
    ports:
      - "4566:4566"

volumes:
  postgres_data:
